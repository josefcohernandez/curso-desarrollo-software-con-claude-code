# Release de un proyecto que NO es instalable (METODOLOGIA.md §9). Los instalables usan el
# release.yml de la convención dockers (templates/github/workflows/release.yml).
#
# El tag lo crea este workflow, no una persona, y solo si todo valida. Se lanza con
#   flujo publicar X.Y.Z        (o: gh workflow run release.yml --ref main -f version=X.Y.Z)
# después de fusionar el PR `chore: release vX.Y.Z` que mueve *Unreleased* a la versión.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión sin la 'v' (p. ej. 1.4.0)"
        required: true
        type: string

permissions:
  contents: write   # crear el tag y la release
  # No lo quites: con un bloque `permissions` explícito, lo que no se nombra queda en «ninguno»,
  # y leer los estados del commit respondería 403.
  statuses: read    # leer la constancia de la verificación local

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # El commit del dispatch, no «lo que haya en main»: la constancia de abajo se comprueba
          # sobre $GITHUB_SHA y el tag se crea en HEAD, así que tienen que ser el mismo commit.
          ref: ${{ github.sha }}

      - name: Validar
        id: v
        env:
          VERSION: ${{ inputs.version }}
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          fallo() { echo "::error::$*"; exit 1; }
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fallo "La versión debe ser X.Y.Z (sin la v): $VERSION"
          tag="v$VERSION"
          [[ $GITHUB_REF == "refs/heads/$RAMA" ]] || fallo "Lánzalo desde $RAMA (--ref $RAMA)"
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null || fallo "$tag ya existe: un número no se reutiliza"
          ultimo="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [[ -n $ultimo && "$(printf '%s\n' "$ultimo" "$tag" | sort -V | tail -1)" != "$tag" ]]; then
            fallo "$tag no es mayor que la última versión ($ultimo)"
          fi
          RE="^## \[?v?${VERSION//./\\.}\]?([^0-9.]|$)" \
            awk 'BEGIN{re=ENVIRON["RE"]} $0 ~ re {f=1; next} f && /^## /{exit} f' CHANGELOG.md > notas.md
          grep -q '[^[:space:]]' notas.md || fallo "CHANGELOG.md no tiene la sección de $VERSION (fusiona antes el PR 'chore: release $tag')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # La verificación (gitleaks, scripts/check.sh, árbol limpio) corre en la máquina de quien
      # publica (`flujo publicar` → flujo verificar), no aquí. Lo que llega es su constancia, un
      # estado sobre el commit. Se exige `success`: que no conste nada no es haber pasado.
      # GitHub devuelve los estados del más reciente al más antiguo: el primero es el vigente.
      - name: Verificado en local
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          estado="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
            -q '[.[] | select(.context == "metodologia/publicable")][0].state // ""')"
          if [[ $estado != success ]]; then
            echo "::error::$GITHUB_SHA no consta como verificado (metodologia/publicable: '${estado:-sin estado}'). Publica con flujo publicar, que lo verifica en local y deja la constancia."
            exit 1
          fi
          echo "$GITHUB_SHA consta como verificado."

      - name: Tag y release
        env:
          TAG: ${{ steps.v.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notas.md
